name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Verify manifest version matches tag
        run: |
          MANIFEST_VERSION=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          if [ "$MANIFEST_VERSION" != "${{ steps.version.outputs.VERSION }}" ]; then
            echo "ERROR: manifest.json version ($MANIFEST_VERSION) != tag (${{ steps.version.outputs.VERSION }})"
            exit 1
          fi
          echo "Version match: $MANIFEST_VERSION"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y zip

      - name: Verify and package
        run: make

      - name: Generate updates.json
        run: ./scripts/gen-updates.sh --from-release

      - name: Display updates.json
        run: cat dist/updates.json

      - name: Create GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.VERSION }}
          tag_name: v${{ steps.version.outputs.VERSION }}
          files: |
            dist/json-formatter-${{ steps.version.outputs.VERSION }}.xpi
            dist/updates.json
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Commit updates.json to main branch
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci: update updates.json for v${{ steps.version.outputs.VERSION }}"
          file_pattern: dist/updates.json
          branch: main
          create_branch: false
