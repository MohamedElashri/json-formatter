name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Prepare public release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Verify tag matches manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os
          version = json.load(open("manifest.json"))["version"]
          assert os.environ["RELEASE_TAG"] == f"v{version}", "Tag must match manifest version"
          PY

      - name: Install release tools
        run: npm ci --ignore-scripts

      - name: Verify, package, and validate with Mozilla
        run: make test package source

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            firefox_extension.zip
            source_code.zip
            dist/*-unsigned.xpi
            dist/*-listing-kit.zip
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          body_path: CHANGELOG.md
          draft: true
          prerelease: false
